<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsoChazas USCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<main class="container">
    <div class="card auth-card p-4 bg-white">
        <div class="text-center mb-3">
            <i class="bi bi-mortarboard-fill fs-1" style="color: var(--usco-vinotinto);"></i>
            <h3 class="fw-bold mt-2" data-i18n="login.title">Iniciar Sesión</h3>
            <p class="text-muted small" data-i18n="login.subtitle">Ingresa con tu correo institucional @usco.edu.co</p>
        </div>

        <div id="alert-login"></div>

        <form id="form-login">
            <div class="mb-3">
                <label class="form-label fw-semibold" data-i18n="login.email">Correo institucional</label>
                <input type="email" id="correo" class="form-control" placeholder="usuario@usco.edu.co" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" data-i18n="login.password">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-usco" data-i18n="login.submit">Entrar</button>
            </div>
        </form>

        <div class="text-center small">
            <span data-i18n="login.no_account">¿Aún no tienes cuenta?</span>
            <a href="/register.html" class="fw-bold" style="color: var(--usco-vinotinto);" data-i18n="login.register_link">Regístrate aquí</a>
        </div>
    </div>
</main>

<footer class="py-3 text-center small">
    <div class="container" data-i18n="footer.text">AsoChazas USCO &copy; 2026 - Universidad Surcolombiana</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        await initI18n();
        renderNavbar("login");
    });

    document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const correo = document.getElementById("correo").value.trim();
        const password = document.getElementById("password").value;

        try {
            const data = await apiFetch("/auth/login", {
                method: "POST",
                body: JSON.stringify({ correo, password })
            });
            saveSession(data);
            window.location.href = data.rol === "ADMIN" ? "/admin.html" : "/index.html";
        } catch (err) {
            showAlert("alert-login", err.message, "danger");
        }
    });
</script>
</body>
</html>
