<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsoChazas USCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<header class="hero-usco py-4 mb-4">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <span class="badge badge-dorado mb-2"><i class="bi bi-shop me-1"></i><span data-i18n="chaza.badge">Chaza Verificada USCO</span></span>
                <h1 class="h2 fw-bold mb-1" id="chaza-nombre" data-i18n="chaza.loading_title">Cargando chaza...</h1>
                <p class="mb-0 text-white-50" id="chaza-contacto"></p>
            </div>
            <div class="bg-white text-dark rounded px-4 py-2 text-center shadow-sm">
                <div class="small text-muted" data-i18n="chaza.active_count">Productos activos</div>
                <div class="fs-4 fw-bold" style="color: var(--usco-vinotinto);" id="chaza-total">0</div>
            </div>
        </div>
    </div>
</header>

<main class="container mb-5">
    <div class="mb-3">
        <a href="/index.html" class="btn btn-sm btn-outline-usco">
            <i class="bi bi-arrow-left me-1"></i><span data-i18n="chaza.back_catalog">Volver al catálogo general</span>
        </a>
    </div>

    <div id="alert-chaza"></div>

    <div id="grid-chaza-productos" class="row g-4">
        <div class="text-center py-5 text-muted" data-i18n="chaza.loading_grid">Cargando inventario de la chaza...</div>
    </div>
</main>

<footer class="py-3 text-center small">
    <div class="container" data-i18n="footer.text">AsoChazas USCO &copy; 2026 - Universidad Surcolombiana</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chaza.js"></script>
</body>
</html>
