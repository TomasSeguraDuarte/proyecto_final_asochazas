<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsoChazas USCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<main class="container my-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none" style="color: var(--usco-vinotinto);" data-i18n="nav.catalog">Catálogo</a></li>
            <li class="breadcrumb-item"><a href="#" id="bread-categoria" class="text-decoration-none" style="color: var(--usco-vinotinto);" data-i18n="prod_detail.breadcrumb_cat">Categoría</a></li>
            <li class="breadcrumb-item active" id="bread-nombre" data-i18n="prod_detail.breadcrumb_prod">Producto</li>
        </ol>
    </nav>

    <div id="alert-producto"></div>

    <div id="contenedor-detalle" class="card shadow-sm border-0 mb-5">
        <div class="card-body p-4 text-center text-muted" data-i18n="prod_detail.loading">Cargando información del producto...</div>
    </div>

    <section id="seccion-relacionados" class="d-none">
        <h4 class="fw-bold mb-3" style="color: var(--usco-vinotinto);" data-i18n="prod_detail.related_title">Más en esta categoría</h4>
        <div id="grid-relacionados" class="row g-4"></div>
    </section>
</main>

<footer class="py-3 text-center small">
    <div class="container" data-i18n="footer.text">AsoChazas USCO &copy; 2026 - Universidad Surcolombiana</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/producto.js"></script>
</body>
</html>
