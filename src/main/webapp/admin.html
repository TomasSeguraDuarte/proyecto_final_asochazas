<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsoChazas USCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<main class="container my-4">
    <h2 class="fw-bold mb-3" style="color: var(--usco-vinotinto);">
        <i class="bi bi-shield-lock-fill me-2"></i><span data-i18n="admin.title">Panel de Administración</span>
    </h2>

    <div id="alert-admin"></div>

    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-solicitudes" type="button" data-i18n="admin.tab_requests">
                Solicitudes de Vendedor
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-usuarios" type="button" data-i18n="admin.tab_users">
                Gestión de Usuarios
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-moderacion" type="button" data-i18n="admin.tab_moderation">
                Moderación de Productos
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-solicitudes">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3" data-i18n="admin.pending_title">Solicitudes Pendientes de Revisión</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th data-i18n="th.student">Estudiante</th>
                                    <th data-i18n="th.proposal">Propuesta</th>
                                    <th data-i18n="th.description">Descripción</th>
                                    <th data-i18n="th.actions">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-solicitudes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-usuarios">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3" data-i18n="admin.users_title">Usuarios Registrados</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th data-i18n="th.name">Nombre</th>
                                    <th data-i18n="th.email">Correo</th>
                                    <th data-i18n="th.role">Rol</th>
                                    <th data-i18n="th.status">Estado</th>
                                    <th data-i18n="th.actions">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-moderacion">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3" data-i18n="admin.all_products_title">Todos los Productos</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th data-i18n="th.product">Producto</th>
                                    <th data-i18n="th.seller">Vendedor</th>
                                    <th data-i18n="th.price">Precio</th>
                                    <th data-i18n="th.status">Estado</th>
                                    <th data-i18n="th.moderation">Moderación</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-productos-admin"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="py-3 text-center small">
    <div class="container" data-i18n="footer.text">AsoChazas USCO &copy; 2026 - Universidad Surcolombiana</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
